name: Publish approved member content

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: member-content-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Sync approved public data
        env:
          MEMBER_PUBLISH_SYNC_TOKEN: ${{ secrets.MEMBER_PUBLISH_SYNC_TOKEN }}
        run: node scripts/sync-member-publishing.js
      - name: Generate public pages
        run: |
          node scripts/generate-people-pages.js
          node scripts/generate-gallery-profile-links.js
          node scripts/generate-news-pages.js
      - name: Verify public site
        run: |
          node scripts/check-site.js
          node scripts/check-concerts-data.js
          git diff --check
      - name: Commit and publish changes
        run: |
          git config user.name "cysh-band-publisher"
          git config user.email "actions@users.noreply.github.com"
          # assets/img/news 一定要一起送出：會員平台上傳的文章圖片是在同步時才下載進來的，
          # 沒有加進來就等於「文章寫著圖片網址、檔案卻沒進版本庫」，官網上會變成破圖。
          git add data content people news concerts assets/img/news assets/img/members photos/profile-links.js feed.xml sitemap.xml index.html concerts.html
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Publish approved member content"
            # 排程發布與人手動推送會互相撞到：只要在這個工作跑的一兩分鐘之內有人推了東西，
            # 這裡的 push 就會被 GitHub 以 non-fast-forward 拒絕，整個工作失敗，
            # 於是下一步的 --ack 不會執行——會員平台就一直停在「已核准，等待上官網」。
            # 所以推不上去時先把對方的更動接下來再推，最多試三次。
            pushed=""
            for attempt in 1 2 3; do
              if git push origin main; then pushed="yes"; break; fi
              echo "推送被拒絕（第 ${attempt} 次），先接上遠端的更動再試"
              git pull --rebase --autostash origin main || break
            done
            if [ -z "$pushed" ]; then
              echo "::error::推不上去，這一批沒有發布。下一次排程會再試一次。"
              exit 1
            fi
          fi
      - name: Record published revision
        id: ack
        env:
          MEMBER_PUBLISH_SYNC_TOKEN: ${{ secrets.MEMBER_PUBLISH_SYNC_TOKEN }}
        run: node scripts/sync-member-publishing.js --ack "$(git rev-parse HEAD)"
      # 任何一步失敗都要讓會員平台知道，而且要說出壞在哪一步。
      # 以前失敗就整個工作結束、什麼都不回報，後台只會一直顯示
      # 「已核准，等待上官網」——看起來像在等，其實是壞了。
      - name: Report failure to the member platform
        if: failure()
        env:
          MEMBER_PUBLISH_SYNC_TOKEN: ${{ secrets.MEMBER_PUBLISH_SYNC_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/sync-member-publishing.js --fail "自動發布流程" \
            "GitHub Actions 這一次的發布失敗了，詳細錯誤請看執行紀錄：$RUN_URL"
