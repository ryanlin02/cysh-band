<script>
  (() => {
    let viewportFrame = 0;
    const syncTourViewportHeight = () => {
      cancelAnimationFrame(viewportFrame);
      viewportFrame = requestAnimationFrame(() => {
        const viewport = window.visualViewport;
        const height = viewport && viewport.scale === 1 ? viewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--tour-viewport-height', `${Math.round(height)}px`);
      });
    };
    syncTourViewportHeight();
    addEventListener('resize', syncTourViewportHeight, { passive: true });
    addEventListener('orientationchange', syncTourViewportHeight, { passive: true });
    window.visualViewport?.addEventListener('resize', syncTourViewportHeight, { passive: true });

    idleTimer = setTimeout(() => shell.classList.add('controls-idle'), 4500);
  }
}

function showToast(message) {
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.hidden = false;
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3600);
}

function closePanel({ restoreFocus = true } = {}) {
  if (!activePanel) return;
  panel.hidden = true;
  panelScrim.hidden = true;
  shell.classList.remove('panel-open');
  panelButtons.forEach(b => b.setAttribute('aria-expanded', 'false'));
  activePanel = null;
  delete panel.dataset.size;
  if (restoreFocus && lastPanelTrigger) lastPanelTrigger.focus({ preventScroll: true });
  wakeControls();
}

function openPanel(name, trigger) {
  const samePanel = activePanel === name && !panel.hidden;
  if (samePanel) return closePanel();
  activePanel = name;
  panel.dataset.size = name === 'scenes' || name === 'map' ? 'full' : 'sheet';
  lastPanelTrigger = trigger || lastPanelTrigger;
  panelTitle.textContent = { scenes: '選擇場景', map: '地圖與位置', info: '導覽說明' }[name];
  panelViews.forEach(view => { view.hidden = view.dataset.panelView !== name; });
  panelButtons.forEach(b => b.setAttribute('aria-expanded', String(b.dataset.panel === name)));
  panel.hidden = false;
  panelScrim.hidden = false;
  shell.classList.add('panel-open');
  shell.classList.remove('controls-idle');
  panel.querySelector('.panel-body').scrollTop = 0;
  requestAnimationFrame(() => panelClose.focus({ preventScroll: true }));
}

panelButtons.forEach(button => button.addEventListener('click', () => openPanel(button.dataset.panel, button)));
panelClose.addEventListener('click', () => closePanel());
panelScrim.addEventListener('click', () => closePanel());
panel.addEventListener('keydown', event => {
  if (event.key !== 'Tab') return;
  const focusable = [...panel.querySelectorAll('button:not([disabled]),a[href]')]
    .filter(el => !el.closest('[hidden]'));
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && activePanel) closePanel();
  if (event.key === 'Escape' && !gyroIntro.hidden) dismissGyroIntro();
});
['pointerdown', 'pointermove', 'keydown'].forEach(type =>
  shell.addEventListener(type, wakeControls, { passive: true }));

document.head.appendChild(Object.assign(document.createElement('style'),
  { textContent: SEAT_MAP_CSS + PLAN_MAP_CSS + TOUR_DOT_CSS }));

// ── Stage A 實測定案的設定，改動前請看維護手冊 ──────────────
const gl = document.createElement('canvas').getContext('webgl2')
        || document.createElement('canvas').getContext('webgl');
const maxTex = gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 4096;
const TIER = maxTex >= 16384 ? 'full' : maxTex >= 8192 ? 'mid' : 'preview';

const regions = TOUR.regions
  .filter(r => r.status === 'ready' && r.nodes.length)
  .sort((a, b) => a.order - b.order);
const sceneMenu = TOUR.sceneMenu || [];

// 影像由網站既有的 Cloudflare R2 自訂網域提供
const srcOf = (region, n, tier) =>
  (TOUR.imageBase || (region.workDir ? `../../../${region.workDir}/` : '')) + n.images[tier];
// 檢視器的網址與一般縮圖分開快取，避免無 Origin 的縮圖回應被 WebGL 重用。
const viewerSrcOf = (region, n, tier) => srcOf(region, n, tier) + '?viewer=1';

let region = regions[0];
let cur = 0;
let floor = region.nodes[0].floor;

const viewer = new Viewer({
  container: 'viewer',
  panorama: viewerSrcOf(region, region.nodes[0], 'preview'),
  caption: region.nodes[0].name,
  navbar: false,
  defaultZoomLvl: 30,
  // 全景之間不做旋轉式轉場。旋轉到目標角度雖然最後正確，
  // 但手機陀螺儀會放大這段甩動感，改以短暫淡入維持方向感。
  defaultTransition: { speed: 260, effect: 'fade', rotation: false },
  plugins: [
    [GyroscopePlugin, { touchmove: true, moveMode: 'fast' }],
    [MarkersPlugin, {}],
  ],
  loadingTxt: '載入中',
});
const rd = viewer.renderer && viewer.renderer.renderer;
if (rd && rd.setPixelRatio) rd.setPixelRatio(Math.min(devicePixelRatio, 2));

const gyroPlugin = viewer.getPlugin(GyroscopePlugin);
const gyroLabel = gyroBtn.querySelector('span');
let gyroRequested = false;
let navigationInProgress = false;
const sessionGet = key => { try { return sessionStorage.getItem(key); } catch (_) { return null; } };
const sessionSet = (key, value) => { try { sessionStorage.setItem(key, value); } catch (_) {} };

function syncGyroState(enabled) {
  const active = enabled || (navigationInProgress && gyroRequested);
  gyroBtn.setAttribute('aria-pressed', String(active));
  gyroLabel.textContent = active ? '關閉感應' : '感應';
  gyroBtn.setAttribute('aria-label', active ? '關閉手機動作感應' : '開啟手機動作感應');
}

function dismissGyroIntro() {
  gyroIntro.hidden = true;
  shell.classList.remove('intro-open');
  sessionSet('hall-tour-gyro-intro', 'seen');
  wakeControls();
}

async function startGyroscope() {
  gyroBtn.disabled = true;
  gyroStart.disabled = true;
  gyroStart.textContent = '正在開啟…';
  try {
    await gyroPlugin.start('fast');
    gyroRequested = true;
    dismissGyroIntro();
    showToast('感應導覽已開啟；轉動手機即可環顧四周');
  } catch (_) {
    gyroRequested = false;
    dismissGyroIntro();
    showToast('未能開啟動作感應，仍可用手指拖曳瀏覽');
  } finally {
    gyroBtn.disabled = false;
    gyroStart.disabled = false;
    gyroStart.textContent = '開啟感應導覽';
    syncGyroState(gyroPlugin.isEnabled());
  }
}

gyroPlugin.addEventListener('gyroscope-updated', event => syncGyroState(event.gyroscopeEnabled));
gyroBtn.addEventListener('click', async () => {
  if (gyroRequested || gyroPlugin.isEnabled()) {
    gyroRequested = false;
    gyroPlugin.stop();
    showToast('感應導覽已關閉');
  } else {
    await startGyroscope();
  }
});
gyroStart.addEventListener('click', startGyroscope);
gyroSkip.addEventListener('click', dismissGyroIntro);

gyroPlugin.isSupported().then(supported => {
  gyroBtn.disabled = !supported;
  if (!supported) {
    gyroBtn.hidden = true;
  }
}).catch(() => {
  gyroBtn.disabled = true;
  gyroBtn.hidden = true;
});

document.getElementById('fullscreenBtn').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await shell.requestFullscreen();
  } catch (_) {
    showToast('這個瀏覽器目前無法切換全螢幕');
  }
});
if (!shell.requestFullscreen) document.getElementById('fullscreenBtn').hidden = true;

// 座位表與平面圖是兩種定位方式，依區域使用的欄位決定顯示哪一種
const mapEl = document.getElementById('map');
let seatMap = null, planMap = null;

const SEAT_POS = new Map();
HALL_SEATS.floors.forEach(f => f.rows.forEach(r => r.seats.forEach(s =>
  SEAT_POS.set(`${f.id}-${r.row}-${s.n}`, { floor: f.id, row: r.row, c: s.c }))));

function usesSeats() { return region.nodes.some(n => n.seat); }

// ── 全景內跳點 ───────────────────────────────────────────
// 圓點而非箭頭：我們是在固定拍攝點之間跳，圓點讀作「那裡可以站」，
// 箭頭會暗示連續移動，且方位差幾度就看得出歪。
const markersPlugin = viewer.getPlugin(MarkersPlugin);
const nodesById = new Map();
const regionsById = new Map();
TOUR.regions.forEach(r => {
  regionsById.set(r.id, r);
  (r.nodes || []).forEach(n => nodesById.set(n.id, n));
});

function refreshDots() {
  if (!markersPlugin) return;
  markersPlugin.clearMarkers();
  const links = linksFor(region.nodes[cur], region, { seatPos: SEAT_POS, regionsById, nodesById });
  toMarkers(links).forEach(m => markersPlugin.addMarker(m));
}

markersPlugin && markersPlugin.addEventListener('select-marker', e => {
  const l = e.marker.data;
  if (!l) return;
  if (l.region !== region.id) {
    const r = regionsById.get(l.region);
    const i = l.id ? r.nodes.findIndex(n => n.id === l.id) : 0;
    switchRegion(r, i < 0 ? 0 : i, { motion: 'forward' });
  } else {
    go(region.nodes.findIndex(n => n.id === l.id), { motion: 'forward' });
  }
});

function buildMap() {
  mapEl.innerHTML = '';
  seatMap = planMap = null;
  document.getElementById('mapTitle').textContent = usesSeats() ? '從座位看出去' : '平面圖';
  document.getElementById('mapNote').textContent = usesSeats()
    ? '點紅色圓點跳到該拍攝位置；也可以直接點座位，會切到最接近的畫面。'
    : '點紅色圓點跳到該拍攝位置。';

  if (usesSeats()) {
    seatMap = createSeatMap(mapEl, {
      data: HALL_SEATS,
      onSeatClick(seat) {
        let best = null, bd = Infinity;
        region.nodes.forEach((n, i) => {
          const q = n.seat && SEAT_POS.get(n.seat);
          if (!q) return;
          const p = SEAT_POS.get(seat.id);
          const d = Math.hypot(q.c - p.c, (q.row - p.row) * 2.2)
                  + (q.floor === p.floor ? 0 : 40);
          if (d < bd) { bd = d; best = i; }
        });
        if (best !== null) { go(best); closePanelOnCompact(); }
      },
    });
    seatMap.setMarkers(
      region.nodes.filter(n => n.seat).map(n => ({
        id: n.id, seatId: n.seat, label: n.name, n: region.nodes.indexOf(n) + 1,
      })),
      m => { go(region.nodes.findIndex(n => n.id === m.id)); closePanelOnCompact(); });
  } else {
    const plans = region.id === 'greenroom'
      ? { 'B1': '../../assets/hall-tour/plan/B1.png' }
      : { '1F': '../../assets/hall-tour/plan/1F.png',
          '2F': '../../assets/hall-tour/plan/2F.png' };
    planMap = createPlanMap(mapEl, {
      plans,
      floor,
      pickable: false,
      markerScale: region.id === 'greenroom' ? 0.72 : 1,
      onMarker(m) { go(region.nodes.findIndex(n => n.id === m.id)); closePanelOnCompact(); },
    });
  }
  refreshMap();
}

function refreshMap() {
  const n = region.nodes[cur];
  if (seatMap) { seatMap.select(n.seat || null); seatMap.activeMarker(n.id); }
  if (planMap) {
    planMap.setMarkers(region.nodes.filter(x => x.plan)
      .map((x, i) => ({ id: x.id, floor: x.floor, x: x.plan.x, y: x.plan.y,
                        label: x.name, n: region.nodes.indexOf(x) + 1 })));
    planMap.active(n.id);
  }
}

function buildSceneMenu() {
  const grid = document.getElementById('sceneMenu');
  grid.innerHTML = '';
  sceneMenu.forEach(entry => {
    const ready = entry.status === 'ready';
    const active = ready && entry.regionId === region.id && entry.floor === floor;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'scene-card';
    b.setAttribute('aria-pressed', String(active));
    b.setAttribute('aria-label', ready ? `選擇${entry.name}` : `${entry.name}，尚未開放`);
    if (!ready) b.disabled = true;

    const img = document.createElement('img');
    img.src = TOUR.imageBase + entry.image;
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    b.appendChild(img);

    if (!ready) {
      const status = document.createElement('span');
      status.className = 'scene-card-status';
      status.textContent = '尚未開放';
      b.appendChild(status);
    }

    const copy = document.createElement('span');
    copy.className = 'scene-card-copy';
    if (active) {
      const current = document.createElement('span');
      current.className = 'scene-card-current';
      current.textContent = '目前場景';
      copy.appendChild(current);
    }
    copy.append(entry.name);
    b.appendChild(copy);

    if (ready) {
      b.onclick = () => {
        const target = regionsById.get(entry.regionId);
        const start = target.nodes.findIndex(n => n.id === entry.startNode);
        switchRegion(target, start);
        closePanelOnCompact();
      };
    }
    grid.appendChild(b);
  });
}

function closePanelOnCompact() {
  if (IS_COMPACT()) closePanel({ restoreFocus: false });
}

let loadedPano = viewerSrcOf(regions[0], regions[0].nodes[0], "preview");
let pendingYaw = null;
let navigationQueue = Promise.resolve();
const FORWARD_PUSH_ZOOM = 6;
const ARRIVAL_PULLBACK_ZOOM = 2;
const FORWARD_PUSH_DURATION = 150;

const clampZoom = level => Math.max(0, Math.min(100, level));

// 手機上連點不同場景時，Photo Sphere Viewer 會中止前一張尚未完成的下載。
// 將切換依序執行，避免兩次 setPanorama 互相取消並留下錯誤。
function queueNavigation(task) {
  navigationQueue = navigationQueue.then(task).catch(error => {
    console.error('場景切換失敗', error);
  });
  return navigationQueue;
}

function switchRegion(r, startIndex = 0, options = {}) {
  return queueNavigation(async () => {
    const prev = region.nodes[cur];
    const carried = carryOverYaw(prev, r.nodes[startIndex]);
    region = r; cur = startIndex; floor = r.nodes[startIndex].floor;
    buildSceneMenu(); buildMap();
    pendingYaw = carried;
    await performGo(startIndex, options, false);
  });
}


// 移動到新場景時維持使用者原本面對的「真實方向」，而不是硬轉回該場景的正面。
// 兩個節點都知道自己「正對平面圖上方時的 yaw」，所以可以換算：
//   目前看的方向（相對正上方）＝ 現在的 yaw − 這個節點的 heading
//   到了新場景，用同樣的相對方向反推新的 yaw。
// 沒有這個換算，每跳一次視角就被拉回正面，走起來會一直迷失方向。
function carryOverYaw(fromNode, toNode) {
  if (!fromNode || !toNode) return null;
  if (typeof fromNode.heading !== 'number' || typeof toNode.heading !== 'number') return null;
  const now = viewer.getPosition().yaw * 180 / Math.PI;
  return ((toNode.heading + (now - fromNode.heading)) % 360 + 360) % 360;
}

function go(i, options = {}, keepDirection = true) {
  const requestedRegion = region;
  return queueNavigation(() => {
    if (requestedRegion !== region) return;
    return performGo(i, options, keepDirection);
  });
}

async function performGo(i, options = {}, keepDirection = true) {
  navigationInProgress = true;
  // 陀螺儀在全景替換期間仍持續回報裝置角度，會和新場景的
  // 目標視角互相拉扯。先暫停，換好畫面後再以目前方向恢復。
  const restoreGyroscope = gyroRequested && gyroPlugin.isEnabled();
  if (restoreGyroscope) gyroPlugin.stop();
  syncGyroState(restoreGyroscope ? false : gyroPlugin.isEnabled());
  try {
    await performSceneChange(i, options, keepDirection);
  } finally {
    if (restoreGyroscope && gyroRequested && !gyroPlugin.isEnabled()) {
      try {
        // setPanorama 指定視角時會呼叫 stopAll；使用者已授權且原本開啟時，自動恢復。
        await gyroPlugin.start('fast');
      } catch (_) {
        gyroRequested = false;
        showToast('感應模式未能自動恢復，請再點一次「感應」');
      }
    }
    navigationInProgress = false;
    syncGyroState(gyroPlugin.isEnabled());
  }
}

async function performSceneChange(i, options = {}, keepDirection = true) {
  // 延續方向要在改 cur 之前算，否則抓到的已經是新場景
  const carried = keepDirection ? carryOverYaw(region.nodes[cur], region.nodes[i]) : null;
  cur = i;
  const n = region.nodes[i];
  if (n.floor !== floor) {
    floor = n.floor;
    if (planMap) planMap.setFloor(floor);
  }
  buildSceneMenu();

  document.getElementById('nowName').textContent = n.name;
  const positionText = n.seat && seatMap && seatMap.get(n.seat)
    ? `拍攝位置約在 ${seatMap.get(n.seat).label}` : '';
  document.getElementById('nowPos').textContent = positionText;
  document.getElementById('infoSceneName').textContent = n.name;
  document.getElementById('infoScenePos').textContent = positionText;
  document.getElementById('nowDesc').textContent = n.description || '';
  refreshMap();

  const useYaw = carried != null ? carried
               : pendingYaw != null ? pendingYaw
               : (n.heading || 0);
  pendingYaw = null;
  const startYaw = useYaw * Math.PI / 180;
  const forwardMotion = options?.motion === 'forward' && !REDUCED_MOTION;
  const currentZoom = viewer.getZoomLevel();
  const arrivalZoom = forwardMotion
    ? clampZoom(currentZoom - ARRIVAL_PULLBACK_ZOOM)
    : currentZoom;

  // 只在點選環景內的跳點時產生輕微的「向前」感；地圖選點與
  // 場景入口維持單純淡入，避免跨距離跳轉看起來像真的在前進。
  if (forwardMotion) {
    // 不等待 viewer.animate() 的完成 promise。某些環景切換中，該 promise
    // 會被標記選取流程卡住；改以固定的短時長接續換圖，避免只放大卻不前進。
    try {
      const pushAnimation = viewer.animate({
        zoom: clampZoom(currentZoom + FORWARD_PUSH_ZOOM),
        speed: FORWARD_PUSH_DURATION,
      });
      // PSV 回傳的是可 then 的 Animation，不保證有 Promise.catch()。
      // 僅觀察失敗，絕不讓動畫回傳值阻塞下一張全景。
      if (pushAnimation && typeof pushAnimation.then === 'function') {
        pushAnimation.then(() => {}, () => {});
      }
    } catch (_) {}
    await new Promise(resolve => setTimeout(resolve, FORWARD_PUSH_DURATION));
  }
  const previewSrc = viewerSrcOf(region, n, 'preview');
  if (previewSrc !== loadedPano) {
    await viewer.setPanorama(previewSrc, {
      transition: REDUCED_MOTION ? false : { speed: 260, effect: 'fade', rotation: false },
      caption: n.name,
      position: { yaw: startYaw, pitch: 0 },
      zoom: arrivalZoom,
    });
  } else {
    viewer.rotate({ yaw: startYaw, pitch: 0 });
  }
  loadedPano = previewSrc;

  const hi = viewerSrcOf(region, n, TIER);
  if (hi !== loadedPano) {
    // 不重送 position／zoom，讓高清替換保留目前視角，也避免第二次停止控制器。
    await viewer.setPanorama(hi, {
      transition: false, showLoader: false, caption: n.name,
    });
    loadedPano = hi;
  }
  refreshDots();
}

buildSceneMenu();
buildMap();
viewer.addEventListener('ready', async () => {
  go(0, null, false);
  wakeControls();
  const supported = await gyroPlugin.isSupported().catch(() => false);
  const mobileLike = matchMedia('(pointer: coarse)').matches;
  if (supported && mobileLike && !sessionGet('hall-tour-gyro-intro')) {
    setTimeout(() => {
      if (activePanel || !gyroIntro.hidden) return;
      gyroIntro.hidden = false;
      shell.classList.add('intro-open');
      shell.classList.remove('controls-idle');
    }, 700);
  }
}, { once: true });
viewer.addEventListener('panorama-error', e => console.error('全景載入失敗', e.error));
</script>
</body>
</html>
