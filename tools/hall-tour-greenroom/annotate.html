<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>演出團隊休息區｜人工標記工具</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.15.1/index.min.css">
<style>
:root{--paper:#f7f4ee;--card:#fffdf9;--ink:#27211c;--muted:#746a62;--line:#ddd5c9;--accent:#8c2f28;--good:#36734c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}.app{max-width:1540px;margin:auto;padding:18px}.top{display:flex;gap:16px;align-items:end;justify-content:space-between;margin-bottom:14px}.top h1{font-size:22px;margin:0}.top p{color:var(--muted);margin:2px 0 0}.progress{font-size:13px;color:var(--muted);text-align:right}.steps{background:#f0ebe1;border-left:4px solid var(--accent);padding:10px 14px;margin:0 0 14px}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 12px #3320100b}.scene-list{display:flex;gap:6px;overflow:auto;padding:2px 0 8px}.scene-list button{min-width:42px}.scene-list button.done{border-color:#a7c7ad;background:#edf6ee;color:#265e3c}.scene-list button.on{background:var(--accent);border-color:var(--accent);color:white}#viewer{height:min(58vh,700px);min-height:380px;border-radius:11px;overflow:hidden;background:#191512}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.grow{flex:1}button,input,select{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--card);color:var(--ink);cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--ink);border-color:var(--ink);color:white}button.accent{background:var(--accent);border-color:var(--accent);color:white}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f3bd57;outline-offset:2px}input,select{min-height:44px;border:1px solid var(--line);border-radius:9px;background:white;padding:7px 10px;max-width:100%}.stat{font-size:13px;color:var(--muted)}.plan-frame{position:relative;border:1px solid var(--line);border-radius:10px;overflow:auto;background:white;max-height:68vh}.plan-frame img{display:block;width:100%;height:auto;min-width:620px;opacity:.76}.markers{position:absolute;inset:0;min-width:620px}.marker{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:#fffdf9;color:var(--accent);font-weight:700;font-size:13px}.marker.on{background:var(--accent);color:white}.help{font-size:13px;color:var(--muted);margin:8px 0}.link-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.link-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.link{display:flex;align-items:center;gap:4px;background:#f2eee6;border-radius:9px;padding:4px 4px 4px 9px;font-size:13px}.link button{min-height:28px;padding:1px 7px;border:0;background:transparent;color:var(--accent)}.placing{background:#fff1df;border-left:4px solid #d58527;padding:9px 11px;margin-top:10px;font-size:13px}.save{margin-top:16px}.tour-pin{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:3px solid #8c2f28;background:#fffdf9;color:#8c2f28;font-weight:700;box-shadow:0 2px 10px #0006}@media(max-width:940px){.layout{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.progress{text-align:left}#viewer{height:52vh;min-height:320px}.plan-frame{max-height:56vh}}@media(max-width:520px){.app{padding:10px}.link-tools{grid-template-columns:1fr}.top h1{font-size:19px}}
.plan-frame img,.markers{min-width:0}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div><h1>演出團隊休息區｜人工標記工具</h1><p>你只要依照片順序操作：定位、設定正面、在門口放下一張。</p></div><div class="progress" id="progress">讀取中…</div></header>
  <p class="steps"><b>每張照片三件事：</b>① 在右側配置圖點拍攝位置　② 把左側畫面轉到「平面圖正上方」後按設定正面　③ 用「上一張／下一張」在畫面中的門口或走道放圓點。每次操作都會先保留在本機，最後再按儲存。</p>
  <div class="scene-list card" id="sceneList" aria-label="選擇照片"></div>
  <div class="layout">
    <section class="card"><div id="viewer" aria-label="目前環景照片"></div><div class="controls"><button id="prev">← 上一張</button><button id="next">下一張 →</button><button class="primary grow" id="setHeading">把目前方向設為正面</button><span class="stat" id="headingStat">尚未設定</span></div><div class="controls"><label>場景名稱 <input id="name" size="24"></label><span class="stat" id="saveState">尚未儲存</span></div></section>
    <aside class="card"><h2 style="font-size:17px;margin:0">① 在配置圖點拍攝位置</h2><p class="help">紅點代表已定位的照片；目前照片為實心紅點。這張配置圖以演出團隊休息區為主。</p><div class="plan-frame" id="planFrame"><img src="/data/plan.png" id="planImage" alt="演出團隊休息區配置圖"><div class="markers" id="markers"></div></div><p class="stat" id="positionStat">尚未定位</p><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><h2 style="font-size:17px;margin:0">② 在畫面中放可前往的圓點</h2><div class="link-tools"><button id="linkPrev">在畫面中放「上一張」</button><button id="linkNext">在畫面中放「下一張」</button><select id="other"></select><button id="linkOther">放選取的其他場景</button></div><div class="placing" id="placing" hidden></div><div class="link-list" id="linkList"></div><div class="controls save"><button class="accent" id="save">儲存標記成果</button><span class="stat" id="result"></span></div></aside>
  </div>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","@photo-sphere-viewer/core":"https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.module.js","@photo-sphere-viewer/markers-plugin":"https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.15.1/index.module.js"}}</script>
<script type="module">
import { Viewer } from '@photo-sphere-viewer/core';
import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';
const nodes = await (await fetch('/data/nodes.json', {cache:'no-store'})).json();
let current = 0, dirty = false, placing = null, loaded = null;
const $ = id => document.getElementById(id);
const viewer = new Viewer({container:'viewer', panorama:'/data/' + nodes[0].mid, navbar:['zoom','move','fullscreen'], defaultZoomLvl:30, plugins:[[MarkersPlugin,{}]]});
const markerPlugin = viewer.getPlugin(MarkersPlugin);
const deg = value => ((Math.round(value) % 360) + 360) % 360;
const currentNode = () => nodes[current];
function isDone(n){return n.plan && n.headingSet}
function markDirty(){dirty=true; localStorage.setItem('greenroom-marking', JSON.stringify(nodes)); $('saveState').textContent='本機已暫存，尚未正式儲存'}
function renderProgress(){const located=nodes.filter(n=>n.plan).length, headed=nodes.filter(n=>n.headingSet).length, linked=nodes.filter(n=>(n.links||[]).length).length;$('progress').textContent=`位置 ${located}/${nodes.length}　正面 ${headed}/${nodes.length}　已放圓點 ${linked}/${nodes.length}`}
function renderList(){const box=$('sceneList');box.innerHTML='';nodes.forEach((n,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=n.name;b.className=(i===current?'on ':'')+(isDone(n)?'done':'');b.onclick=()=>load(i);box.append(b)})}
function renderPlan(){const box=$('markers');box.innerHTML='';nodes.forEach((n,i)=>{if(!n.plan)return;const b=document.createElement('button');b.className='marker '+(i===current?'on':'');b.style.left=(n.plan.x*100)+'%';b.style.top=(n.plan.y*100)+'%';b.textContent=i+1;b.title=n.name;b.onclick=e=>{e.stopPropagation();load(i)};box.append(b)});const n=currentNode();$('positionStat').textContent=n.plan?`已定位：x ${n.plan.x.toFixed(3)}　y ${n.plan.y.toFixed(3)}`:'尚未定位：請直接點配置圖'}
function renderLinks(){const n=currentNode();const list=$('linkList');list.innerHTML='';(n.links||[]).forEach(link=>{const i=nodes.findIndex(x=>x.id===link.to);const item=document.createElement('span');item.className='link';item.textContent=i>=0?`${i+1}. ${nodes[i].name}`:link.to;const remove=document.createElement('button');remove.textContent='×';remove.title='移除此圓點';remove.onclick=()=>{n.links=n.links.filter(x=>x.to!==link.to);markDirty();render()};item.append(remove);list.append(item)});markerPlugin.clearMarkers();(n.links||[]).forEach(link=>markerPlugin.addMarker({id:'link-'+link.to,position:{yaw:link.yaw+'deg',pitch:link.pitch+'deg'},html:`<span class="tour-pin">${nodes.findIndex(x=>x.id===link.to)+1}</span>`,size:{width:38,height:38},anchor:'center center'}));$('placing').hidden=!placing;$('placing').textContent=placing?`現在請在左側照片中，點一下通往「${nodes.find(n=>n.id===placing).name}」的門口或走道。` : ''}
function renderOther(){const select=$('other');select.innerHTML='';nodes.forEach((n,i)=>{if(i===current)return;const o=document.createElement('option');o.value=n.id;o.textContent=`${i+1}. ${n.name}`;select.append(o)})}
function render(){const n=currentNode();$('name').value=n.name;$('headingStat').textContent=n.headingSet?`正面已設定：${n.heading}°`:'尚未設定正面';$('linkPrev').disabled=current===0;$('linkNext').disabled=current===nodes.length-1;renderProgress();renderList();renderPlan();renderOther();renderLinks()}
async function load(index){current=index;placing=null;const n=currentNode();if(n.mid!==loaded){await viewer.setPanorama('/data/'+n.mid,{transition:false,caption:n.name});loaded=n.mid}viewer.rotate({yaw:(n.heading||0)*Math.PI/180,pitch:0});render()}
$('planFrame').addEventListener('click',event=>{if(event.target!==$('planImage')&&event.target!==$('markers'))return;const rect=$('planImage').getBoundingClientRect();const n=currentNode();n.plan={x:+((event.clientX-rect.left)/rect.width).toFixed(4),y:+((event.clientY-rect.top)/rect.height).toFixed(4)};markDirty();render()});
$('setHeading').onclick=()=>{currentNode().heading=deg(viewer.getPosition().yaw*180/Math.PI);currentNode().headingSet=true;markDirty();render()};
$('name').oninput=e=>{currentNode().name=e.target.value;markDirty();renderList();renderPlan();renderOther()};
$('prev').onclick=()=>load((current-1+nodes.length)%nodes.length);$('next').onclick=()=>load((current+1)%nodes.length);
function place(id){placing=placing===id?null:id;renderLinks()}$('linkPrev').onclick=()=>{if(current)place(nodes[current-1].id)};$('linkNext').onclick=()=>{if(current<nodes.length-1)place(nodes[current+1].id)};$('linkOther').onclick=()=>place($('other').value);
viewer.addEventListener('click',event=>{if(!placing)return;const n=currentNode(),link={to:placing,yaw:+(event.data.yaw*180/Math.PI).toFixed(2),pitch:+(event.data.pitch*180/Math.PI).toFixed(2)};n.links=n.links||[];const existing=n.links.findIndex(x=>x.to===placing);if(existing>=0)n.links[existing]=link;else n.links.push(link);placing=null;markDirty();renderLinks();renderProgress()});
$('save').onclick=async()=>{const b=$('save');b.disabled=true;b.textContent='儲存中…';try{const result=await (await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(nodes)})).json();if(!result.ok)throw Error(result.error);dirty=false;localStorage.removeItem('greenroom-marking');$('result').textContent=`已儲存 ${result.saved} 張；已定位 ${result.located} 張`;$('saveState').textContent='已儲存'}catch(error){$('result').textContent='儲存失敗：'+error.message}b.disabled=false;b.textContent='儲存標記成果'};
const saved=localStorage.getItem('greenroom-marking');if(saved){try{const restored=JSON.parse(saved);if(restored.length===nodes.length&&confirm('偵測到上次尚未正式儲存的標記，要先復原嗎？'))nodes.splice(0,nodes.length,...restored)}catch{}}
addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});viewer.addEventListener('ready',()=>{loaded=nodes[0].mid;load(0)},{once:true});
</script>
</body>
</html>
